[tool.poetry]
name = "based-agent-moralis"
version = "0.2.0"
description = "Autonomous Base trading agent built on OpenAI Swarm, Coinbase Developer Platform, and Moralis"
authors = ["Bharath Babu <bharath.babu@moralis.io>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
cdp-sdk = "^0.21.0"
swarm = { git = "https://github.com/openai/swarm.git" }
openai = "^1.52.2"
web3 = "^7.2.0"
requests = "^2.32.3"
tweepy = "^4.14.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["evals: tool-selection evals that call the OpenAI API"]
addopts = "-m 'not evals'"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.pyright]
# https://github.com/microsoft/pyright/blob/main/docs/configuration.md
useLibraryCodeForTypes = true
exclude = [".cache"]

[tool.ruff]
# https://docs.astral.sh/ruff/configuration/
lint.select = ['E', 'W', 'F', 'I', 'B', 'C4', 'ARG', 'SIM']
lint.ignore = ['E501']

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
